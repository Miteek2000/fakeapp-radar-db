# Base de datos de FakeApp Radar: PostgreSQL + migraciones + catálogo inicial.
# Arranca ESTO primero y luego la API (repo fakeapp-radar-api).
services:
  db:
    build:
      context: ./postgres
    image: fakeapp-radar-db-postgres:16
    container_name: fakeapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:5433:5432"   # solo tu computadora (útil para DBeaver o psql)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default      # necesaria para publicar el puerto 5433 en tu PC
      - fakeapp-net

  # Aplica las migraciones y carga el catálogo; después se apaga (Exited 0 es lo correcto).
  migrate:
    build:
      context: .
      dockerfile: migrator/Dockerfile
    image: fakeapp-radar-db-migrator:dev
    environment:
      POSTGRES_HOST: fakeapp-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fakeapp-net
    restart: "no"

networks:
  # Red compartida con la API: así la API llega a la base sin publicar más puertos.
  # Es INTERNA (sin salida a internet): los contenedores que solo viven aquí no pueden salir.
  fakeapp-net:
    name: fakeapp-net
    internal: true

volumes:
  pgdata:
